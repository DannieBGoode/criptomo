# Build settings live in the Netlify UI; this file only wires the market-data
# proxy function and its public /api/market/* route.

[functions]
  directory = "netlify/functions"

[[redirects]]
  from = "/api/market/*"
  to = "/.netlify/functions/market-data/:splat"
  status = 200

# The ICO section was removed in June 2026; keep old links and indexed URLs
# landing somewhere useful.
[[redirects]]
  from = "/icos/*"
  to = "/calculadora/"
  status = 301

[[redirects]]
  from = "/en/icos/*"
  to = "/en/calculator/"
  status = 301
