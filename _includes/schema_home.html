<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@graph": [
    {
      "@type": "Organization",
      "@id": "{{ site.url }}/#organization",
      "name": "{{ site.title }}",
      "url": "{{ site.url }}",
      "logo": {
        "@type": "ImageObject",
        "url": "{{ site.url }}/images/logo.png",
        "width": 128,
        "height": 32
      },
      "description": "{{ site.description | strip_newlines | escape }}",
      "founder": {
        "@type": "Person",
        "name": "{{ site.author_name }}"
      }{% assign _site_same_as_str = "" %}{% if site.twitter_username %}{% assign _site_same_as_str = _site_same_as_str | append: "https://twitter.com/" | append: site.twitter_username | append: "," %}{% endif %}{% if site.github_username %}{% assign _site_same_as_str = _site_same_as_str | append: "https://github.com/" | append: site.github_username | append: "," %}{% endif %}{% if site.medium_username %}{% assign _site_same_as_str = _site_same_as_str | append: "https://medium.com/" | append: site.medium_username | append: "," %}{% endif %}{% if site.linkedin_username %}{% assign _site_same_as_str = _site_same_as_str | append: site.linkedin_username | append: "," %}{% endif %}{% assign _site_same_as = _site_same_as_str | split: "," %}{% assign _site_same_as_count = 0 %}{% for _url in _site_same_as %}{% if _url != "" %}{% assign _site_same_as_count = _site_same_as_count | plus: 1 %}{% endif %}{% endfor %}{% if _site_same_as_count > 0 %},
      "sameAs": [{% assign _site_same_as_first = true %}{% for _url in _site_same_as %}{% if _url != "" %}{% unless _site_same_as_first %},{% endunless %}"{{ _url }}"{% assign _site_same_as_first = false %}{% endif %}{% endfor %}]{% endif %}
    },
    {
      "@type": "WebSite",
      "@id": "{{ site.url }}/#website",
      "url": "{{ site.url }}",
      "name": "{{ site.title }}",
      "description": "{{ site.description | strip_newlines | escape }}",
      "publisher": {
        "@id": "{{ site.url }}/#organization"
      },
      "inLanguage": "{{ page.lang | default: site.locale | slice: 0, 2 | default: 'es' }}"
    }
  ]
}
</script>
