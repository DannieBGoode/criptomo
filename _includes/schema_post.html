<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@graph": [
{% assign _post_lang = page.lang | default: site.locale | slice: 0, 2 | default: "es" %}
{% assign _post_author_key = page.author | default: "daniel" %}
{% capture _post_author_page_url %}{% include author_page_url.html author_key=_post_author_key lang=_post_lang %}{% endcapture %}
{% assign _post_author_page_url = _post_author_page_url | strip %}
{% assign _post_author_person_id = site.url | append: _post_author_page_url | append: "#person" %}
{% assign _post_image = page.banner_image | default: site.banner_image %}
{% assign _post_image_url = "" %}
{% if _post_image %}
  {% assign _post_image_prefix = _post_image | slice: 0, 4 %}
  {% if _post_image_prefix == "http" %}
    {% assign _post_image_url = _post_image %}
  {% elsif _post_image contains "/images/posts/" or _post_image contains "/images/" %}
    {% assign _post_image_url = _post_image | prepend: site.url %}
  {% else %}
    {% assign _post_image_url = _post_image | prepend: "/images/posts/" | prepend: site.url %}
  {% endif %}
{% endif %}
    {% include schema_person_object.html author_key=_post_author_key lang=_post_lang person_id=_post_author_person_id %},
    {
      "@type": "Article",
      "@id": {{ site.url | append: page.url | append: "#article" | jsonify }},
      "mainEntityOfPage": {
        "@type": "WebPage",
        "@id": {{ site.url | append: page.url | jsonify }}
      },
      "headline": {{ page.title | truncate: 110 | jsonify }},
      "description": {{ page.description | default: page.excerpt | strip_html | strip_newlines | truncate: 160 | jsonify }},
      "datePublished": {{ page.date | date_to_xmlschema | jsonify }},
      "dateModified": {{ page.last_modified_at | default: page.date | date_to_xmlschema | jsonify }},
      "inLanguage": {{ _post_lang | jsonify }},
      "author": {
        "@id": {{ _post_author_person_id | jsonify }}
      },
      "publisher": {
        "@type": "Organization",
        "@id": {{ site.url | append: "/#organization" | jsonify }},
        "name": {{ site.title | jsonify }},
        "url": {{ site.url | jsonify }},
        "logo": {
          "@type": "ImageObject",
          "url": {{ site.url | append: "/images/logo.png" | jsonify }},
          "width": 128,
          "height": 32
        }
      },
      "isPartOf": {
        "@type": "WebSite",
        "@id": {{ site.url | append: "/#website" | jsonify }},
        "url": {{ site.url | jsonify }},
        "name": {{ site.title | jsonify }}
      }{% if _post_image_url != "" %},
      "image": {
        "@type": "ImageObject",
        "url": {{ _post_image_url | jsonify }}
      }{% endif %}
    }
  ]
}
</script>
