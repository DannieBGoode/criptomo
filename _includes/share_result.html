<div class="popup show">
  <header>
    <span>{{ site.data.translations.share-calculator.title[page.lang] }}</span>
    <!-- <div class="close"><i class="uil uil-times"></i></div> -->
  </header>
  <div class="content">
    <p>{{ site.data.translations.share-calculator.body-1[page.lang] }}</p>
    <ul class="icons">
      <a href="#" data-social="facebook">
        <i class="icon-facebook"></i></a>

      <a href="#" data-social="twitter">
        <i class="icon-twitter"></i>
      </a>

      <a href="#" data-social="linkedin">
        <i class="icon-linkedin2"></i>
      </a>

      <a href="#" data-social="whatsapp">
        <i class="icon-whatsapp"></i>
      </a>
      
      <a href="#" data-social="telegram">
        <i class="icon-telegram"></i>
      </a>

      <a href="#" data-social="reddit">
        <i class="icon-reddit-alien"></i>
      </a>

    </ul>
    <p>{{ site.data.translations.share-calculator.body-2[page.lang] }}</p>
    <div class="field">
      <i class="icon-link"></i>
      <input type="text" class="share-text" readonly value="{{ site.url }}/calculadora/">
      <button type="button" class="copy" data-copy-label="{{ site.data.translations.share-calculator.copy[page.lang] }}" data-copied-label="{{ site.data.translations.share-calculator.copied[page.lang] }}">{{ site.data.translations.share-calculator.copy[page.lang] }}</button>
    </div>
  </div>
</div>
