<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "WebApplication",
  "@id": {{ site.url | append: page.url | append: "#webapp" | jsonify }},
  "name": {{ page.title | truncate: 110 | jsonify }},
  "url": {{ site.url | append: page.url | jsonify }},
  "description": {{ page.description | strip_html | strip_newlines | truncate: 160 | jsonify }},
  "applicationCategory": "FinanceApplication",
  "operatingSystem": "Any",
  "browserRequirements": "Requires JavaScript and a modern web browser.",
  "inLanguage": {{ page.lang | default: site.locale | slice: 0, 2 | default: "es" | jsonify }},
  "isAccessibleForFree": true,
  "offers": {
    "@type": "Offer",
    "price": "0",
    "priceCurrency": "USD"
  },
  "publisher": {
    "@type": "Organization",
    "@id": {{ site.url | append: "/#organization" | jsonify }},
    "name": {{ site.title | jsonify }},
    "url": {{ site.url | jsonify }},
    "logo": {
      "@type": "ImageObject",
      "url": {{ site.url | append: "/images/logo.png" | jsonify }},
      "width": 128,
      "height": 32
    }
  }{% if page.banner_image %},
  "image": {
    "@type": "ImageObject",
    "url": {{ "/images/" | append: page.banner_image | prepend: site.url | jsonify }}
  }{% endif %}
}
</script>
